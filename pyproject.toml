[project]
name = "homeassistant-combustion"
version = "0.0.0"
description = "Home Assistant integration for Combustion thermometers and gauges"
authors = [{ name = "Larry Gregory", email = "lgregorydev@gmail.com" }]
readme = "README.md"
# Matches Home Assistant's own requirement; see hacs.json for the minimum version.
requires-python = ">=3.14.2,<3.15"
dependencies = [
    # Keep in step with the requirements in custom_components/combustion/manifest.json.
    "combustion_ble==0.10.0",
]

[dependency-groups]
lint = ["ruff==0.17.6"]
dev = [
    # Keep in step with the homeassistant key in hacs.json.
    "homeassistant==2026.10.4",
    "colorlog==6.12.0",
]
test = [
    # Pins the same Home Assistant version as the dev group.
    "pytest-homeassistant-custom-component==0.13.375",
    # Requirements of the bluetooth_adapters, bluetooth, and usb components in
    # Home Assistant 2026.10.4, which the test harness doesn't install.
    "aiousbwatcher==1.1.2",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.2.0",
    "habluetooth==7.1.3",
    "serialx==1.15.1",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2,<3"

[tool.coverage.run]
source = ["custom_components/combustion"]
branch = true

[tool.coverage.html]
directory = "test_results/cov_html"

[tool.coverage.xml]
output = "test_results/cov_xml/coverage.xml"

[tool.coverage.json]
output = "test_results/cov_json/coverage.json"

[tool.pytest.ini_options]
addopts = [
    "-rxf",
    "-x",
    "-v",
    "-l",
    "--junitxml=test_results/pytest.xml",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-report=json",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
