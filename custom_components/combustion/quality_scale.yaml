# Self-assessment for this custom integration, not an official Home Assistant rating.
# Rule definitions: https://contributors.home-assistant.io/core/quality-scale/rules/
rules:
  # Bronze
  action-setup:
    status: done
    comment: async_setup registers combustion.configure_safecook, which validates its probe and reports when the integration isn't ready to reach it. Cooking targets use the standard number.set_value and button.press actions.
  appropriate-polling:
    status: exempt
    comment: Readings are pushed by Bluetooth advertisements and optional connected status notifications. The expiry timer only checks cached data, countdowns, and device availability. Firmware and hardware versions, which advertisements don't carry, are read once a day per online device, through an existing connection where possible.
  brands:
    status: done
    comment: Icons and logos are in brand/ and https://github.com/home-assistant/brands/tree/master/custom_integrations/combustion.
  common-modules:
    status: done
    comment: Shared Bluetooth handling is in coordinator.py, the devices entities read from are in device.py, and the base entity is in entity.py.
  config-flow:
    status: done
    comment: Manual setup and Bluetooth discovery share a confirmation flow. An options flow enables prediction connections, which also set and cancel cooking targets.
  config-flow-test-coverage:
    status: done
    comment: Tests cover setup, discovery, invalid advertisements, and duplicate entries. CI requires 100% line and branch coverage of config_flow.py.
  dependency-transparency:
    status: done
    comment: >-
      combustion_ble is Apache-2.0 licensed and published on PyPI.
      The pinned 0.10.0 release includes host-managed prediction sessions for probes and
      MeatNet repeaters, the connection planner the integration follows, firmware and
      hardware revision reads, and SafeCook configuration.
      Source and license: https://github.com/legrego/combustion_ble/tree/v0.10.0.
      Release: https://github.com/legrego/combustion_ble/releases/tag/v0.10.0.
      Package: https://pypi.org/project/combustion-ble/0.10.0/.
  docs-actions:
    status: done
    comment: README.md documents combustion.configure_safecook and its fields, and explains using the entities in standard automations.
  docs-conditions:
    status: exempt
    comment: The integration does not provide custom conditions.
  docs-high-level-description:
    status: done
    comment: README.md describes Combustion thermometers, gauges, passive readings, and optional prediction connections.
  docs-installation-instructions:
    status: done
    comment: README.md covers Bluetooth prerequisites, installing the custom component, discovery, and manual UI setup.
  docs-removal-instructions:
    status: done
    comment: README.md explains deleting the integration and removing manually installed files.
  docs-triggers:
    status: exempt
    comment: The integration does not provide custom triggers.
  entity-event-setup:
    status: done
    comment: CombustionEntity subscribes in async_added_to_hass and registers the unsubscribe callback with async_on_remove.
  entity-unique-id:
    status: done
    comment: Each entity ID combines a device serial number and an entity description key; tests preserve existing IDs.
  has-entity-name:
    status: done
    comment: CombustionEntity sets has_entity_name; names come from translation keys or device classes.
  runtime-data:
    status: done
    comment: A typed CombustionConfigEntry stores its coordinator in entry.runtime_data.
  test-before-configure:
    status: exempt
    comment: Devices are discovered at runtime without user-supplied connection details. Discovery advertisements are validated before confirmation. Optional prediction connections are established as direct probes are heard.
  test-before-setup:
    status: exempt
    comment: There is no device connection or configuration to validate during setup. The integration subscribes to Home Assistant Bluetooth and adds devices as advertisements arrive, including after startup.
  unique-config-entry:
    status: done
    comment: A single MeatNet unique ID and duplicate checks in both entry points prevent multiple entries for the same network.

  # Silver
  action-exceptions:
    status: done
    comment: Cooking target and SafeCook commands raise a translated HomeAssistantError when no connection reaches the probe, the probe or repeater rejects the command, or it times out. The SafeCook action raises ServiceValidationError for devices that aren't probes, probes not heard yet, and predictions being disabled; the SafeCook selects raise it for programs that can't be written from Home Assistant.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads both platforms; unload callbacks remove Bluetooth, timer, and platform listeners. Tests cover unloading and reloading with existing and newly discovered devices.
  docs-configuration-parameters:
    status: exempt
    comment: There is no options flow. README.md explains that no settings are required.
  docs-installation-parameters:
    status: exempt
    comment: Setup only asks for confirmation, with no input parameters. README.md documents this setup flow.
  entity-unavailable:
    status: done
    comment: CombustionEntity.available follows MeatNet device availability. Tests verify expiry after 15 seconds and automatic recovery when advertisements resume.
  integration-owner:
    status: done
    comment: The manifest lists @legrego as the integration owner.
  log-when-unavailable:
    status: done
    comment: The coordinator logs at info level once per availability transition. Tests verify one unavailable message and one recovery message despite repeated updates.
  parallel-updates:
    status: done
    comment: Every platform sets PARALLEL_UPDATES to 0. Read-only entities only update from pushed data; the library matches each command to its response, so commands for several probes can run at once.
  reauthentication-flow:
    status: exempt
    comment: Passive Bluetooth advertisements require no authentication or credentials.
  test-coverage:
    status: done
    comment: Tests cover more than 95% of every integration module, including branches. CI enforces this per module and retains 100% coverage for config_flow.py.

  # Higher tiers have not been assessed.
  # Gold
  devices: todo
  diagnostics: todo
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
