name: "Validate"

on:
  workflow_dispatch:
  # schedule:
  #   - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"

  tests:
    runs-on: "ubuntu-latest"
    name: Run tests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v7"
      - name: Install Poetry
        run: pipx install "poetry>=2.2,<3"
      - name: Setup Python
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
          cache: "poetry"
      - name: Install requirements
        run: poetry install
      - name: Check that Home Assistant can install the manifest requirements
        # Home Assistant installs requirements with uv, under the versions it pins.
        run: |
          constraints="$(poetry run python -c 'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / "package_constraints.txt")')"
          poetry run uv pip install --dry-run --constraint "$constraints" $(jq -r '.requirements[]' custom_components/combustion/manifest.json)
      - name: Run tests
        run: poetry run pytest
      - name: Require full config flow coverage
        run: poetry run coverage report --include="*/combustion/config_flow.py" --fail-under=100
      - name: Pytest coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pytest-xml-coverage-path: ./test_results/cov_xml/coverage.xml
          junitxml-path: ./test_results/pytest.xml
